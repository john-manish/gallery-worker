<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Private Gallery</title>


<style>

:root{

    --bg:#070b16;

    --surface:
    rgba(18,24,38,.72);

    --border:
    rgba(255,255,255,.12);

    --text:#ffffff;

    --muted:#aeb8cc;

    --accent:#3b82f6;

    --accent2:#8b5cf6;

}



/* RESET */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}



html,
body{

    width:100%;
    height:100%;
    overflow:hidden;

}



body{

    background:
    linear-gradient(
        135deg,
        #070b16,
        #101827
    );

    color:var(--text);

    font-family:
    Inter,
    system-ui,
    -apple-system,
    sans-serif;

}




/* MAIN */

.page{

    min-height:100svh;

    display:grid;

    place-items:center;

    position:relative;

    overflow:hidden;

    padding:24px;

}




/* BACKGROUND EFFECTS */

.background{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

}




.orb{

    position:absolute;

    border-radius:50%;

    filter:blur(90px);

    opacity:.45;

    animation:
    drift 14s ease-in-out infinite alternate;

}



.orb.one{

    width:350px;
    height:350px;

    background:#2563eb;

    top:-150px;
    right:-120px;

}



.orb.two{

    width:300px;
    height:300px;

    background:#8b5cf6;

    bottom:-120px;
    left:-100px;

    animation-delay:-5s;

}




@keyframes drift{

    from{

        transform:
        translate(0,0);

    }


    to{

        transform:
        translate(40px,30px);

    }

}





/* CARD */

.card{

    width:min(100%,430px);

    position:relative;

    z-index:2;


    padding:44px 32px;


    text-align:center;


    background:
    var(--surface);


    border:
    1px solid var(--border);


    border-radius:34px;


    backdrop-filter:
    blur(24px);


    -webkit-backdrop-filter:
    blur(24px);


    box-shadow:

    0 35px 100px rgba(0,0,0,.55);


    animation:
    enter .65s cubic-bezier(.22,1,.36,1);

}




@keyframes enter{

    from{

        opacity:0;

        transform:
        translateY(30px)
        scale(.95);

    }


    to{

        opacity:1;

        transform:
        translateY(0)
        scale(1);

    }

}




/* ICON */

.icon{

    width:96px;

    height:96px;


    margin:auto;


    display:grid;

    place-items:center;


    border-radius:30px;


    font-size:44px;


    background:

    linear-gradient(
        135deg,
        rgba(59,130,246,.25),
        rgba(139,92,246,.25)
    );


    animation:
    breathe 3s ease-in-out infinite;

}



@keyframes breathe{

    50%{

        transform:
        scale(1.06);

    }

}





h1{

    margin-top:28px;

    font-size:32px;

    font-weight:800;

    letter-spacing:-.04em;

}




.description{

    margin-top:16px;

    color:var(--muted);

    line-height:1.7;

    font-size:15px;

}





/* BUTTON */

.actions{

    margin-top:32px;

}



.btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;


    padding:15px 30px;


    border-radius:18px;


    background:

    linear-gradient(
        135deg,
        var(--accent),
        #2563eb
    );


    color:white;

    text-decoration:none;


    font-weight:700;


    transition:.25s;


    box-shadow:

    0 15px 35px
    rgba(59,130,246,.35);

}



.btn:hover{

    transform:
    translateY(-3px);


}



.btn:active{

    transform:
    scale(.96);

}





.meta{

    margin-top:22px;

    font-size:13px;

    color:#8993aa;

}



/* MOBILE */

@media(max-width:480px){


.card{

    padding:36px 22px;

}


h1{

    font-size:27px;

}


.icon{

    width:84px;

    height:84px;

}


}



</style>


</head>


<body>


<div class="page">


<div class="background">

<div class="orb one"></div>

<div class="orb two"></div>

</div>



<main class="card"
aria-labelledby="title">


<div class="icon"
aria-hidden="true">

🔒

</div>



<h1 id="title">

Private Gallery

</h1>



<p class="description">

This media belongs to a protected gallery.
Sign in to continue viewing private content.

</p>




<div class="actions">

<a class="btn"
href="https://manish8090.pages.dev/pass.html">

✨ Sign In

</a>

</div>



<p class="meta">

Secure access • Encrypted session • Private media

</p>



</main>



</div>


</body>

</html>
